<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta name="cc-lab" content="hero-gallery-lab">
  <title>Crown Creatives – Hero Gallery Lab</title>

  <!-- SHARED CSS (Unified Crown + Gallery) -->
  <link rel="stylesheet" href="./shared/hero-crown.css">
  <link rel="stylesheet" href="./shared/hero-gallery.css">

  <style>
    body {
      margin: 0;
      background: #111;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
    }

    #lab-title {
      position: fixed;
      top: 20px;
      left: 20px;
      font-size: 18px;
      opacity: 0.7;
      z-index: 999;
    }
  </style>
</head>

<body data-lab-name="hero-gallery-lab">

  <div id="lab-title">HERO GALLERY LAB — MERGED CROWN + GALLERY — 25/06/2026</div>

  <!-- HERO CROWN -->
  <div id="hero-crown-container">
    <img id="hero-crown-day" class="hero-crown float" src="/assets/icons/day-crown.svg" alt="Day Crown">
    <img id="hero-crown-night" class="hero-crown float" src="/assets/icons/night-crown.svg" alt="Night Crown">
  </div>

  <!-- LEFT LANE -->
  <div class="hero-gallery-lane hero-gallery-left">
    <img class="hero-gallery-img" src="" alt="">
  </div>

  <!-- RIGHT LANE -->
  <div class="hero-gallery-lane hero-gallery-right">
    <img class="hero-gallery-img" src="" alt="">
  </div>

  <!-- GLOW OVERLAY -->
  <div class="hero-gallery-glow-overlay">
    <div class="hero-gallery-glow-left"></div>
    <div class="hero-gallery-glow-right"></div>
  </div>

  <!-- ADMIN OVERLAY -->
  <div id="gallery-admin" class="gallery-admin gallery-admin-hidden">
    <div class="gallery-admin-header">
      <span>Hero Gallery Admin</span>
      <button id="gallery-admin-close" type="button">×</button>
    </div>

    <div class="gallery-admin-body">
      <div class="gallery-admin-row">
        <button data-action="prev">Prev</button>
        <button data-action="next">Next</button>
        <button data-action="pause">Pause</button>
        <button data-action="shuffle">Shuffle: Off</button>
      </div>

      <div class="gallery-admin-row">
        <label for="gallery-speed">Speed</label>
        <input id="gallery-speed" type="range" min="3000" max="15000" step="1000" value="6000">
        <span id="gallery-speed-label">6s</span>
      </div>

      <div class="gallery-admin-row">
        <button id="gallery-refresh" type="button">Refresh Manifest</button>
      </div>

      <div id="gallery-toast" class="gallery-toast gallery-toast-hidden">
        <span id="gallery-toast-text"></span>
      </div>
    </div>
  </div>

  <!-- SHARED JS ENGINES -->
  <script src="./shared/heroCrownEngine.js"></script>
  <script src="./shared/heroGalleryEngine.js"></script>

  <!-- LAB WRAPPERS -->
  <script src="./hero-crown.js"></script>
  <script src="./hero-gallery.js"></script>
  <script src="./lab-harness.js"></script>

</body>
</html>
