<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CROWN OS — Scanner Dashboard</title>
<style>
  body {
    margin: 0;
    background: #0d0d0f;
    font-family: Consolas, monospace;
    color: #e0e0e0;
  }

  /* OS Panel Container */
  .panel {
    width: 100%;
    height: 100vh;
    display: grid;
    grid-template-rows: 60px auto;
    background: #111;
    border-top: 2px solid #444;
  }

  /* Header */
  .header {
    background: #181818;
    border-bottom: 1px solid #333;
    display: flex;
    align-items: center;
    padding: 0 20px;
    font-size: 18px;
    letter-spacing: 1px;
    color: #00e0ff;
  }

  /* Layout */
  .content {
    display: grid;
    grid-template-columns: 300px auto;
    height: calc(100vh - 60px);
  }

  /* Sidebar */
  .sidebar {
    background: #141414;
    border-right: 1px solid #333;
    overflow-y: auto;
    padding: 10px;
  }

  .sidebar h3 {
    color: #00e0ff;
    margin-top: 20px;
    margin-bottom: 10px;
  }

  .report-item {
    padding: 8px;
    margin-bottom: 6px;
    background: #1b1b1b;
    border: 1px solid #333;
    cursor: pointer;
  }

  .report-item:hover {
    background: #222;
  }

  /* Main Panel */
  .main {
    padding: 20px;
    overflow-y: auto;
  }

  .module {
    background: #1a1a1a;
    border: 1px solid #333;
    padding: 12px;
    margin-bottom: 12px;
  }

  .module h4 {
    margin: 0 0 6px 0;
    color: #00e0ff;
  }

  .tag {
    display: inline-block;
    padding: 2px 6px;
    margin-right: 6px;
    border-radius: 4px;
    font-size: 12px;
  }

  .scope-test { background: #0044ff; }
  .scope-asset { background: #008844; }
  .scope-page { background: #884400; }
  .scope-script { background: #6600aa; }
  .scope-unknown { background: #444; }

  .kind-legacy { background: #aa0000; }
  .kind-hybrid { background: #cc6600; }
  .kind-gr1 { background: #00ccff; }
  .kind-neutral { background: #555; }

  .issues {
    margin-top: 6px;
    color: #ff6666;
  }

  .actions {
    margin-top: 6px;
    color: #66ff66;
  }

  .creative-box {
    background: #222;
    border: 1px solid #444;
    padding: 10px;
    margin-top: 20px;
  }

  .creative-box h3 {
    color: #ff00ff;
  }
</style>
</head>
<body>

<div class="panel">
  <div class="header">CROWN OS — Scanner Dashboard</div>

  <div class="content">
    <div class="sidebar">
      <h3>Reports</h3>
      <div id="reportList"></div>
    </div>

    <div class="main">
      <h2>Load a report to begin</h2>
      <div id="output"></div>
    </div>
  </div>
</div>

<script>
/* Load available reports */
async function loadReports() {
  const response = await fetch("../reports/");
  const text = await response.text();

  // Extract JSON filenames
  const matches = [...text.matchAll(/href="(scan-[^"]+\.json)"/g)];
  const reportList = document.getElementById("reportList");

  matches.forEach(m => {
    const file = m[1];
    const div = document.createElement("div");
    div.className = "report-item";
    div.textContent = file;
    div.onclick = () => loadReport(file);
    reportList.appendChild(div);
  });
}

/* Load a specific report */
async function loadReport(filename) {
  const response = await fetch("../reports/" + filename);
  const data = await response.json();

  const out = document.getElementById("output");
  out.innerHTML = `
    <h2>Report: ${filename}</h2>
    <p><strong>Project Root:</strong> ${data.projectRoot}</p>
    <p><strong>Scanned At:</strong> ${data.scannedAt}</p>
    <h3>Modules</h3>
  `;

  data.modules.forEach(m => {
    const div = document.createElement("div");
    div.className = "module";

    div.innerHTML = `
      <h4>${m.rel}</h4>
      <span class="tag scope-${m.scope}">${m.scope}</span>
      <span class="tag kind-${m.kind}">${m.kind}</span>

      <div class="issues"><strong>Issues:</strong> ${m.issues.join(", ") || "none"}</div>
      <div class="actions"><strong>Actions:</strong> ${m.actions.join(", ") || "none"}</div>
    `;

    out.appendChild(div);
  });

  if (data.creative && data.creative.length > 0) {
    const creativeBox = document.createElement("div");
    creativeBox.className = "creative-box";

    creativeBox.innerHTML = `<h3>Creative Suggestions</h3>`;

    data.creative.forEach(c => {
      creativeBox.innerHTML += `
        <p><strong>${c.path}</strong><br>
        <em>${c.type}</em>: ${c.message}</p>
      `;
    });

    out.appendChild(creativeBox);
  }
}

loadReports();
</script>

</body>
</html>
