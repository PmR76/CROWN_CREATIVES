name: Build Gallery Manifest

on:
  push:
    paths:
      - "assets/images/gallery/**"
      - ".github/workflows/build-gallery-manifest.yml"

jobs:
  build-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate gallery-manifest.json
        run: |
          cd assets/images/gallery
          echo "[" > gallery-manifest.json
          ls -1 *.jpg *.jpeg *.png *.webp *.gif 2>/dev/null | sed 's/^/  "/; s/$/"/' | paste -sd "," - >> gallery-manifest.json
          echo "]" >> gallery-manifest.json

      - name: Commit manifest
        run: |
          git config --global user.name "Crown Creatives AutoBot"
          git config --global user.email "actions@github.com"
          git add assets/images/gallery/gallery-manifest.json
          git commit -m "Auto-update gallery manifest" || echo "No changes to commit"

      - name: Push changes
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
