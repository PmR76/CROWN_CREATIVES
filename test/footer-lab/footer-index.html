<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Footer Component</title>

  <!-- Your real component CSS -->
  <link rel="stylesheet" href="./footer.css">

  <!-- LAB-ONLY PAGE BACKDROP -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(#1a1a1a, #000);
      font-family: system-ui, sans-serif;
      color: #eee;
    }

    .lab-content {
      height: 1400px;
      padding: 60px;
      background: linear-gradient(#222, #333);
    }

    .lab-content h1 {
      margin-bottom: 20px;
      font-size: 32px;
      color: #fff;
      text-shadow: 0 0 10px rgba(255,255,255,0.4);
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">

</head>

<body>

  <!-- Fake page content so the footer has something to blur -->
  <div class="lab-content">
    <h1>Footer Lab Simulation</h1>
    <p>This is simulated page content so your frosted glass footer has something to blur.</p>
    <p>Scroll down to test the back‑to‑top triangle button.</p>
  </div>

  <!-- Your exact GR1 footer -->
  <footer id="cc-footer" class="cc-footer">
    <div class="footer-glass">

      <div class="footer-icons" id="footer-icons">
        <img src="./icons/facebook.svg" class="footer-icon" data-id="facebook">
        <img src="./icons/instagram.svg" class="footer-icon" data-id="instagram">
        <img src="./icons/email.svg" class="footer-icon" data-id="email">
        <img src="./icons/copilot.svg" class="footer-icon" data-id="copilot">
      </div>

      <button id="back-to-top" class="back-to-top">▲</button>

      <div class="footer-copy">
        © 2026 Crown Creatives — All Rights Reserved<br>
        Royalty‑Free Music Provided by Pixabay
      </div>

    </div>
  </footer>

  <!-- Your real component JS -->
  <script src="./footer.js"></script>

</body>
</html>
