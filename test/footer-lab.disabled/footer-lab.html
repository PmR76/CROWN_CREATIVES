<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="cc-lab" content="footer-lab">
  <title>Crown Creatives – Footer Lab</title>

  <!-- LAB-ONLY CSS -->
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 20px;
    }

    iframe {
      width: 100%;
      height: 1000px;
      border: 1px solid #444;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
    }

    /* DRAGGABLE HARNESS PANEL */
    #cc-lab-readout {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 260px;
      background: rgba(10,10,20,0.92);
      backdrop-filter: blur(14px);
      border-radius: 14px;
      padding: 12px 14px;
      color: #fff;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      z-index: 999999;
      box-shadow: 0 0 26px rgba(0,0,0,0.6);
      cursor: default;
    }

    #cc-lab-readout-header {
      font-weight: 600;
      margin-bottom: 8px;
      cursor: grab;
    }

    #cc-lab-readout-header:active {
      cursor: grabbing;
    }
  </style>
</head>

<body data-lab-name="footer-lab">

  <!-- COMPONENT IFRAME -->
  <iframe src="./footer-index.html"></iframe>

  <!-- LAB HARNESS -->
  <script src="./lab-harness.js"></script>

</body>
</html>
