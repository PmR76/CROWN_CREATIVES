<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crown Creatives — Header Test</title>

  <!-- Cinematic Header CSS -->
  <link rel="stylesheet" href="header.css">

  <!-- Diagnostic CSS (optional) -->
  <link rel="stylesheet" href="header.test.css">
</head>

<body>

<header class="cc-header">

  <!-- LEFT: SOUND TOGGLE -->
  <div class="header-left">
    <img id="soundToggle"
         class="header-toggle"
         src="/assets/icons/music.png"
         alt="Sound Toggle">
  </div>

  <!-- CENTER: CROWN + TITLE + TAGLINE + NAV -->
  <div class="header-center">

    <div class="header-crown-wrapper">
      <img src="/assets/icons/head-crown.svg"
           class="header-crown"
           alt="Crown">
    </div>

    <div class="header-title-block">
      <h1 class="header-title">CROWN CREATIVES</h1>
      <p class="header-tagline">ARTISTRY • RESILIENCE • IMAGINATION</p>
    </div>

    <nav class="header-nav">
      <ul>
        <li><a href="/index.html">Home</a></li>
        <li><a href="/about.html">About</a></li>
        <li><a href="/gallery.html">Gallery</a></li>
        <li><a href="/projects.html">Projects</a></li>
        <li><a href="/blog.html">Blog</a></li>
        <li><a href="/contact.html">Contact</a></li>
      </ul>
    </nav>

  </div>

  <!-- RIGHT: THEME TOGGLE -->
  <div class="header-right">
    <img id="themeToggle"
         class="header-toggle"
         src="/assets/icons/sun-moon.png"
         alt="Theme Toggle">
  </div>

</header>

<!-- Test Harness JS -->
<script src="header.test.js"></script>

</body>
</html>
