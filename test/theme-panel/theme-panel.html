<!-- ============================================================
     CROWN CREATIVES — BACKGROUND THEME PANEL (V3 FINAL)
     SHIFT+T to open • X to close • Draggable
============================================================ -->

<div id="theme-panel" class="cc-theme-panel">

  <!-- HEADER (DRAG HANDLE) -->
  <div id="theme-panel-header">
    <div id="theme-panel-title">Background Theme</div>
    <div id="theme-panel-close">✕</div>
  </div>

  <div class="theme-panel-body">

    <!-- BACKGROUND THEME OPTIONS -->
    <div class="theme-panel-section-label">Background Modes</div>

    <div class="theme-options">
      <button data-bg="day" class="theme-option-btn">Day Theme</button>
      <button data-bg="night" class="theme-option-btn">Night Theme</button>
    </div>

    <!-- ADMIN TOOLS -->
    <div class="theme-panel-section-label">Admin Tools</div>

    <div class="admin-tools">
      <button id="resetPanelPos" class="admin-btn">Reset Panel Position</button>
    </div>

  </div>

</div>
