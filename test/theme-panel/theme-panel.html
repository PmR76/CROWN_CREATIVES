<div class="theme-panel">
  <div class="theme-panel-header">
    <span>Theme Control Panel</span>
    <button id="themePanelClose">✕</button>
  </div>

  <div class="theme-panel-body">

    <h3>Active Theme</h3>
    <div class="theme-options">
      <button data-theme="light">Light</button>
      <button data-theme="dark">Dark</button>
      <button data-theme="neon">Neon</button>
      <button data-theme="sunset">Sunset</button>
    </div>

    <h3>Admin Tools</h3>
    <div class="admin-tools">
      <button id="resetTogglePos">Reset Toggle Position</button>
      <button id="resetToggleSize">Reset Toggle Size</button>
    </div>

  </div>
</div>
