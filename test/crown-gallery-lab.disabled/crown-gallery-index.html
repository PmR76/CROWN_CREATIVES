<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crown + Gallery Lab — Expanded Engine</title>

  <!-- HERO CROWN CSS -->
  <link rel="stylesheet" href="../hero-crown-lab/hero-crown.css">
  <link rel="stylesheet" href="../hero-crown-lab/theme-gradients.css">
  <link rel="stylesheet" href="../hero-crown-lab/theme-panel.css">

  <!-- HERO GALLERY CSS -->
  <link rel="stylesheet" href="../hero-gallery-lab/hero-gallery.css">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--active-day-gradient);
      transition: background 1.2s ease-in-out;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
      overflow: hidden;
    }

    body.dark-mode {
      background: var(--active-night-gradient);
    }

    #lab-title {
      position: fixed;
      top: 20px;
      left: 20px;
      font-size: 18px;
      opacity: 0.7;
      z-index: 999;
    }

    #themeToggle {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 999;
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div id="lab-title">CROWN + GALLERY LAB — 26/06/2026</div>

<!-- REQUIRED BY theme-engine.js -->
<button id="themeToggle">Toggle Theme</button>

<!-- LEFT GALLERY LANE -->
<div class="hero-gallery-lane hero-gallery-left">
  <img class="hero-gallery-img" src="" alt="">
</div>

<!-- HERO CROWN -->
<div id="hero-crown-container">
  <img id="hero-crown-day" class="hero-crown" src="/assets/icons/day-crown.svg" alt="Day Crown">
  <img id="hero-crown-night" class="hero-crown" src="/assets/icons/night-crown.svg" alt="Night Crown">
</div>

<!-- THEME PANEL -->
<div id="theme-panel" class="cc-theme-panel">

  <div id="theme-panel-header">
    <div id="theme-panel-title">Background Themes</div>
    <div id="theme-panel-timestamp"></div>
    <div id="theme-panel-close">✕</div>
  </div>

  <div class="theme-panel-body">

    <!-- DAY THEMES -->
    <div class="theme-panel-section-label">Day Themes</div>
    <div class="theme-swatch-grid" id="day-swatch-grid">

      <!-- ORIGINAL DAY -->
      <div class="theme-swatch" data-role="day" data-key="sunrise"></div>
      <div class="theme-swatch" data-role="day" data-key="warm-daylight"></div>
      <div class="theme-swatch" data-role="day" data-key="soft-sky"></div>
      <div class="theme-swatch" data-role="day" data-key="sunset-glow"></div>

      <!-- NEW DAY -->
      <div class="theme-swatch" data-role="day" data-key="ocean-mist"></div>
      <div class="theme-swatch" data-role="day" data-key="royal-ember"></div>
      <div class="theme-swatch" data-role="day" data-key="solar-bloom"></div>
      <div class="theme-swatch" data-role="day" data-key="crown-platinum"></div>

      <!-- DAY EXPANSION -->
      <div class="theme-swatch" data-role="day" data-key="sunrise-blush"></div>
      <div class="theme-swatch" data-role="day" data-key="peach-horizon"></div>
      <div class="theme-swatch" data-role="day" data-key="coral-bloom"></div>
      <div class="theme-swatch" data-role="day" data-key="apricot-sky"></div>
      <div class="theme-swatch" data-role="day" data-key="golden-hour"></div>
      <div class="theme-swatch" data-role="day" data-key="sherbet-glow"></div>
      <div class="theme-swatch" data-role="day" data-key="ember-mist"></div>
      <div class="theme-swatch" data-role="day" data-key="radiant-dawn"></div>

      <!-- SEASONAL DAY -->
      <div class="theme-swatch" data-role="day" data-key="winter-frost"></div>
      <div class="theme-swatch" data-role="day" data-key="winter-ice"></div>
      <div class="theme-swatch" data-role="day" data-key="spring-bloom"></div>
      <div class="theme-swatch" data-role="day" data-key="spring-meadow"></div>
      <div class="theme-swatch" data-role="day" data-key="summer-sky"></div>
      <div class="theme-swatch" data-role="day" data-key="summer-heat"></div>
      <div class="theme-swatch" data-role="day" data-key="autumn-leaf"></div>
      <div class="theme-swatch" data-role="day" data-key="autumn-harvest"></div>

      <!-- SCI-FI DAY -->
      <div class="theme-swatch" data-role="day" data-key="xenon-core"></div>
      <div class="theme-swatch" data-role="day" data-key="nebula-storm"></div>
      <div class="theme-swatch" data-role="day" data-key="quantum-rift"></div>
      <div class="theme-swatch" data-role="day" data-key="plasma-reactor"></div>
      <div class="theme-swatch" data-role="day" data-key="cosmic-lattice"></div>
      <div class="theme-swatch" data-role="day" data-key="void-energy"></div>
      <div class="theme-swatch" data-role="day" data-key="astral-flare"></div>
      <div class="theme-swatch" data-role="day" data-key="extraterrestrial"></div>

    </div>

    <!-- NIGHT THEMES -->
    <div class="theme-panel-section-label">Night Themes</div>
    <div class="theme-swatch-grid" id="night-swatch-grid">

      <!-- ORIGINAL NIGHT -->
      <div class="theme-swatch" data-role="night" data-key="midnight-indigo"></div>
      <div class="theme-swatch" data-role="night" data-key="royal-night"></div>
      <div class="theme-swatch" data-role="night" data-key="aurora"></div>
      <div class="theme-swatch" data-role="night" data-key="deep-space"></div>

      <!-- NEW NIGHT -->
      <div class="theme-swatch" data-role="night" data-key="deep-velvet"></div>
      <div class="theme-swatch" data-role="night" data-key="cosmic-royal"></div>
      <div class="theme-swatch" data-role="night" data-key="nebula-drift"></div>
      <div class="theme-swatch" data-role="night" data-key="crown-nocturne"></div>

      <!-- NIGHT EXPANSION -->
      <div class="theme-swatch" data-role="night" data-key="nebula-violet"></div>
      <div class="theme-swatch" data-role="night" data-key="midnight-royal"></div>
      <div class="theme-swatch" data-role="night" data-key="cosmic-indigo"></div>
      <div class="theme-swatch" data-role="night" data-key="ultraviolet-drift"></div>
      <div class="theme-swatch" data-role="night" data-key="deep-abyss"></div>
      <div class="theme-swatch" data-role="night" data-key="lunar-ice"></div>
      <div class="theme-swatch" data-role="night" data-key="starlight-veil"></div>
      <div class="theme-swatch" data-role="night" data-key="aurora-veil"></div>

      <!-- SEASONAL NIGHT -->
      <div class="theme-swatch" data-role="night" data-key="winter-frost"></div>
      <div class="theme-swatch" data-role="night" data-key="winter-ice"></div>
      <div class="theme-swatch" data-role="night" data-key="spring-bloom"></div>
      <div class="theme-swatch" data-role="night" data-key="spring-meadow"></div>
      <div class="theme-swatch" data-role="night" data-key="summer-sky"></div>
      <div class="theme-swatch" data-role="night" data-key="summer-heat"></div>
      <div class="theme-swatch" data-role="night" data-key="autumn-leaf"></div>
      <div class="theme-swatch" data-role="night" data-key="autumn-harvest"></div>

      <!-- SCI-FI NIGHT -->
      <div class="theme-swatch" data-role="night" data-key="xenon-core"></div>
      <div class="theme-swatch" data-role="night" data-key="nebula-storm"></div>
      <div class="theme-swatch" data-role="night" data-key="quantum-rift"></div>
      <div class="theme-swatch" data-role="night" data-key="plasma-reactor"></div>
      <div class="theme-swatch" data-role="night" data-key="cosmic-lattice"></div>
      <div class="theme-swatch" data-role="night" data-key="void-energy"></div>
      <div class="theme-swatch" data-role="night" data-key="astral-flare"></div>
      <div class="theme-swatch" data-role="night" data-key="extraterrestrial"></div>

    </div>

  </div>
</div>

<!-- RIGHT GALLERY LANE -->
<div class="hero-gallery-lane hero-gallery-right">
  <img class="hero-gallery-img" src="" alt="">
</div>

<!-- GLOW OVERLAY -->
<div class="hero-gallery-glow-overlay">
  <div class="hero-gallery-glow-left"></div>
  <div class="hero-gallery-glow-right"></div>
</div>

<!-- ADMIN OVERLAY -->
<div id="gallery-admin" class="gallery-admin gallery-admin-hidden">
  <div class="gallery-admin-header">
    <span>Hero Gallery Admin</span>
    <button id="gallery-admin-close" type="button">×</button>
  </div>

  <div class="gallery-admin-body">
    <div class="gallery-admin-row">
      <button data-action="prev">Prev</button>
      <button data-action="next">Next</button>
      <button data-action="pause">Pause</button>
      <button data-action="shuffle">Shuffle: Off</button>
    </div>

    <div class="gallery-admin-row">
      <label for="gallery-speed">Speed</label>
      <input id="gallery-speed" type="range" min="3000" max="15000" step="1000" value="6000">
      <span id="gallery-speed-label">6s</span>
    </div>

    <div class="gallery-admin-row">
      <button id="gallery-refresh" type="button">Refresh Manifest</button>
    </div>

    <div id="gallery-toast" class="gallery-toast gallery-toast-hidden">
      <span id="gallery-toast-text"></span>
    </div>
  </div>
</div>

<!-- JS MODULES (ORDER MATTERS) -->
<script src="../hero-crown-lab/theme-engine.js"></script>
<script src="../hero-crown-lab/hero-crown.js"></script>
<script src="../hero-crown-lab/theme-panel.js"></script>

<script src="../hero-gallery-lab/hero-gallery.js"></script>

</body>
</html>
