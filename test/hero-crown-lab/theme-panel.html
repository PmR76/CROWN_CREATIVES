<!-- ============================================================
     CROWN CREATIVES — THEME PANEL (LAB VERSION)
     Minimal version for isolated testing
     SHIFT + T to toggle visibility
============================================================ -->

<div id="theme-panel" class="cc-theme-panel">

  <!-- HEADER -->
   <div id="theme-panel-timestamp"></div>

  <div id="theme-panel-header">
    <div id="theme-panel-title">Background Theme</div>
    <div id="theme-panel-close">✕</div>
  </div>

  <div class="theme-panel-body">

    <!-- BACKGROUND OPTIONS -->
    <div class="theme-panel-section-label">Background Modes</div>

    <div class="theme-options">
      <button data-bg="day" class="theme-option-btn">Day</button>
      <button data-bg="night" class="theme-option-btn">Night</button>
    </div>

  </div>

</div>
