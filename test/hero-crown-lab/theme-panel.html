<!-- ============================================================
     CROWN CREATIVES — THEME PANEL (LAB VERSION)
     Expanded with full gradient library
     SHIFT + T to toggle visibility
============================================================ -->

<div id="theme-panel" class="cc-theme-panel">

  <!-- HEADER -->
  <div id="theme-panel-header">
    <div id="theme-panel-title">Background Themes</div>
    <div id="theme-panel-timestamp"></div>
    <div id="theme-panel-close">✕</div>
  </div>

  <div class="theme-panel-body">

    <!-- ============================================================
         DAY THEMES
    ============================================================= -->
    <div class="theme-panel-section-label">Day Themes</div>
    <div class="theme-swatch-grid" id="day-swatch-grid">

      <!-- ORIGINAL DAY -->
      <div class="theme-swatch" data-role="day" data-key="sunrise"></div>
      <div class="theme-swatch" data-role="day" data-key="warm-daylight"></div>
      <div class="theme-swatch" data-role="day" data-key="soft-sky"></div>
      <div class="theme-swatch" data-role="day" data-key="sunset-glow"></div>

      <!-- NEW DAY (ORIGINAL) -->
      <div class="theme-swatch" data-role="day" data-key="ocean-mist"></div>
      <div class="theme-swatch" data-role="day" data-key="royal-ember"></div>
      <div class="theme-swatch" data-role="day" data-key="solar-bloom"></div>
      <div class="theme-swatch" data-role="day" data-key="crown-platinum"></div>

      <!-- DAY EXPANSION -->
      <div class="theme-swatch" data-role="day" data-key="sunrise-blush"></div>
      <div class="theme-swatch" data-role="day" data-key="peach-horizon"></div>
      <div class="theme-swatch" data-role="day" data-key="coral-bloom"></div>
      <div class="theme-swatch" data-role="day" data-key="apricot-sky"></div>
      <div class="theme-swatch" data-role="day" data-key="golden-hour"></div>
      <div class="theme-swatch" data-role="day" data-key="sherbet-glow"></div>
      <div class="theme-swatch" data-role="day" data-key="ember-mist"></div>
      <div class="theme-swatch" data-role="day" data-key="radiant-dawn"></div>

      <!-- SPECIALS AVAILABLE IN DAY -->
      <div class="theme-swatch" data-role="day" data-key="neon"></div>
      <div class="theme-swatch" data-role="day" data-key="galaxy"></div>
      <div class="theme-swatch" data-role="day" data-key="crown-gold"></div>
      <div class="theme-swatch" data-role="day" data-key="royal-blue"></div>

      <!-- SPECIAL EXPANSION (DAY-ENABLED) -->
      <div class="theme-swatch" data-role="day" data-key="neon-magenta"></div>
      <div class="theme-swatch" data-role="day" data-key="electric-crown"></div>
      <div class="theme-swatch" data-role="day" data-key="royal-spectrum"></div>
      <div class="theme-swatch" data-role="day" data-key="hypernova"></div>
      <div class="theme-swatch" data-role="day" data-key="neon-ocean"></div>
      <div class="theme-swatch" data-role="day" data-key="prism-burst"></div>
      <div class="theme-swatch" data-role="day" data-key="crown-flare"></div>
      <div class="theme-swatch" data-role="day" data-key="galaxy-rift"></div>

    </div>

    <!-- ============================================================
         NIGHT THEMES
    ============================================================= -->
    <div class="theme-panel-section-label">Night Themes</div>
    <div class="theme-swatch-grid" id="night-swatch-grid">

      <!-- ORIGINAL NIGHT -->
      <div class="theme-swatch" data-role="night" data-key="midnight-indigo"></div>
      <div class="theme-swatch" data-role="night" data-key="royal-night"></div>
      <div class="theme-swatch" data-role="night" data-key="aurora"></div>
      <div class="theme-swatch" data-role="night" data-key="deep-space"></div>

      <!-- NEW NIGHT (ORIGINAL) -->
      <div class="theme-swatch" data-role="night" data-key="deep-velvet"></div>
      <div class="theme-swatch" data-role="night" data-key="cosmic-royal"></div>
      <div class="theme-swatch" data-role="night" data-key="nebula-drift"></div>
      <div class="theme-swatch" data-role="night" data-key="crown-nocturne"></div>

      <!-- NIGHT EXPANSION -->
      <div class="theme-swatch" data-role="night" data-key="nebula-violet"></div>
      <div class="theme-swatch" data-role="night" data-key="midnight-royal"></div>
      <div class="theme-swatch" data-role="night" data-key="cosmic-indigo"></div>
      <div class="theme-swatch" data-role="night" data-key="ultraviolet-drift"></div>
      <div class="theme-swatch" data-role="night" data-key="deep-abyss"></div>
      <div class="theme-swatch" data-role="night" data-key="lunar-ice"></div>
      <div class="theme-swatch" data-role="night" data-key="starlight-veil"></div>
      <div class="theme-swatch" data-role="night" data-key="aurora-veil"></div>

      <!-- SPECIALS AVAILABLE IN NIGHT -->
      <div class="theme-swatch" data-role="night" data-key="neon"></div>
      <div class="theme-swatch" data-role="night" data-key="galaxy"></div>
      <div class="theme-swatch" data-role="night" data-key="crown-gold"></div>
      <div class="theme-swatch" data-role="night" data-key="royal-blue"></div>

      <!-- SPECIAL EXPANSION (NIGHT-ENABLED) -->
      <div class="theme-swatch" data-role="night" data-key="neon-magenta"></div>
      <div class="theme-swatch" data-role="night" data-key="electric-crown"></div>
      <div class="theme-swatch" data-role="night" data-key="royal-spectrum"></div>
      <div class="theme-swatch" data-role="night" data-key="hypernova"></div>
      <div class="theme-swatch" data-role="night" data-key="neon-ocean"></div>
      <div class="theme-swatch" data-role="night" data-key="prism-burst"></div>
      <div class="theme-swatch" data-role="night" data-key="crown-flare"></div>
      <div class="theme-swatch" data-role="night" data-key="galaxy-rift"></div>

    </div>

  </div>
</div>
