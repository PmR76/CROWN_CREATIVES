<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hero Crown Lab</title>

  <!-- LAB CSS ONLY -->
  <link rel="stylesheet" href="hero-crown.css">
  <link rel="stylesheet" href="theme-panel.css">
  <link rel="stylesheet" href="theme-gradients.css">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #fceabb, #f8b500);
      transition: background 8s ease-in-out;
    }
    body.dark-mode {
      background: linear-gradient(135deg, #1b1b3a, #3a1b5a);
    }

    #themeToggle {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 999;
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>

<body>
<div id="version-check">VERSION 8 — 24/06/2026 — 20:58</div>

  <!-- SIMPLE THEME TOGGLE -->
  <button id="themeToggle">Toggle Theme</button>

  <!-- HERO CROWN -->
  <div id="hero-crown-container">
    <img id="hero-crown-day" class="hero-crown" src="/assets/icons/day-crown.svg" alt="Day Crown">
    <img id="hero-crown-night" class="hero-crown" src="/assets/icons/night-crown.svg" alt="Night Crown">
  </div>

  <!-- THEME PANEL -->
  <div id="theme-panel" class="cc-theme-panel">

    <!-- HEADER -->
    <div id="theme-panel-header">
      <div id="theme-panel-title">Background Themes</div>
      <div id="theme-panel-timestamp"></div>
      <div id="theme-panel-close">✕</div>
    </div>

    <div class="theme-panel-body">

      <!-- DAY THEMES -->
      <div class="theme-panel-section-label">Day Themes</div>
      <div class="theme-swatch-grid" id="day-swatch-grid">

        <!-- DAY -->
        <div class="theme-swatch" data-role="day" data-key="sunrise" title="Sunrise"></div>
        <div class="theme-swatch" data-role="day" data-key="warm-daylight" title="Warm Daylight"></div>
        <div class="theme-swatch" data-role="day" data-key="soft-sky" title="Soft Sky"></div>
        <div class="theme-swatch" data-role="day" data-key="sunset-glow" title="Sunset Glow"></div>

        <!-- SPECIAL (AVAILABLE FOR DAY) -->
        <div class="theme-swatch" data-role="day" data-key="neon" title="Neon (Special)"></div>
        <div class="theme-swatch" data-role="day" data-key="galaxy" title="Galaxy (Special)"></div>
        <div class="theme-swatch" data-role="day" data-key="crown-gold" title="Crown Gold (Special)"></div>
        <div class="theme-swatch" data-role="day" data-key="royal-blue" title="Royal Blue (Special)"></div>

      </div>

      <!-- NIGHT THEMES -->
      <div class="theme-panel-section-label">Night Themes</div>
      <div class="theme-swatch-grid" id="night-swatch-grid">

        <!-- NIGHT -->
        <div class="theme-swatch" data-role="night" data-key="midnight-indigo" title="Midnight Indigo"></div>
        <div class="theme-swatch" data-role="night" data-key="royal-night" title="Royal Night"></div>
        <div class="theme-swatch" data-role="night" data-key="aurora" title="Aurora"></div>
        <div class="theme-swatch" data-role="night" data-key="deep-space" title="Deep Space"></div>

        <!-- SPECIAL (AVAILABLE FOR NIGHT) -->
        <div class="theme-swatch" data-role="night" data-key="neon" title="Neon (Special)"></div>
        <div class="theme-swatch" data-role="night" data-key="galaxy" title="Galaxy (Special)"></div>
        <div class="theme-swatch" data-role="night" data-key="crown-gold" title="Crown Gold (Special)"></div>
        <div class="theme-swatch" data-role="night" data-key="royal-blue" title="Royal Blue (Special)"></div>

      </div>

    </div>
  </div>

  <!-- LAB JS -->
  <script src="theme-engine.js"></script>
  <script src="hero-crown.js"></script>
  <script src="theme-panel.js"></script>
  <script src="debug-crown.js"></script>

</body>
</html>
