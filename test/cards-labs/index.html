<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crown Creatives — Cards Lab</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--active-day-gradient, linear-gradient(135deg, #1e1e1e, #2a2a2a));
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    #lab-title {
      margin-top: 40px;
      font-size: 22px;
      opacity: 0.7;
      letter-spacing: 0.5px;
    }

    .cards-wrapper {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 40px;
      padding: 60px 40px;
      box-sizing: border-box;
      position: relative;
      z-index: 2;
    }

    /* ============================================================
       FROSTED CARD — DEEP GLASS + GLOW + ANIMATED BORDER
    ============================================================ */

    .frost-card {
      position: relative;
      padding: 32px;
      border-radius: 22px;

      /* Frosted glass */
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      background: rgba(255, 255, 255, 0.08);

      /* Border + glow */
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow:
        0 8px 30px rgba(0,0,0,0.25),
        0 0 20px var(--crown-glow-color, rgba(255,255,255,0.2));

      /* Animation */
      animation: borderPulse 4s ease-in-out infinite;

      /* 3D tilt */
      transform-style: preserve-3d;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    @keyframes borderPulse {
      0% { box-shadow: 0 8px 30px rgba(0,0,0,0.25), 0 0 12px var(--crown-glow-color, rgba(255,255,255,0.2)); }
      50% { box-shadow: 0 8px 30px rgba(0,0,0,0.25), 0 0 28px var(--crown-glow-color, rgba(255,255,255,0.4)); }
      100% { box-shadow: 0 8px 30px rgba(0,0,0,0.25), 0 0 12px var(--crown-glow-color, rgba(255,255,255,0.2)); }
    }

    /* Hover lift + stronger glow */
    .frost-card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow:
        0 12px 40px rgba(0,0,0,0.35),
        0 0 32px var(--crown-glow-color, rgba(255,255,255,0.4));
    }

    /* ============================================================
       PARTICLE SHIMMER LAYER
    ============================================================ */

    .frost-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.25), transparent 60%),
                  radial-gradient(circle at 80% 80%, rgba(255,255,255,0.15), transparent 70%);
      opacity: 0.25;
      pointer-events: none;
      animation: shimmerMove 6s linear infinite;
    }

    @keyframes shimmerMove {
      0% { transform: translate(0,0); }
      50% { transform: translate(10px, -10px); }
      100% { transform: translate(0,0); }
    }

    /* ============================================================
       CARD TEXT
    ============================================================ */

    .frost-card h2 {
      margin: 0 0 12px 0;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-shadow: 0 0 8px var(--crown-glow-color, rgba(255,255,255,0.3));
    }

    .frost-card p {
      margin: 0;
      font-size: 16px;
      line-height: 1.55;
      opacity: 0.85;
    }

    /* Footer spacer */
    .footer-spacer {
      height: 120px;
      width: 100%;
    }
  </style>
</head>

<body>

  <div id="lab-title">CROWN CREATIVES — CARDS LAB</div>

  <div class="cards-wrapper">

    <div class="frost-card">
      <h2>Artistry</h2>
      <p>Creativity expressed through craft, vision, and imagination.</p>
    </div>

    <div class="frost-card">
      <h2>Resilience</h2>
      <p>Strength to rise, rebuild, and transform challenges into growth.</p>
    </div>

    <div class="frost-card">
      <h2>Imagination</h2>
      <p>The spark that turns ideas into reality and stories into worlds.</p>
    </div>

  </div>

  <div class="footer-spacer"></div>

  <script>
    /* ============================================================
       3D TILT INTERACTION
    ============================================================ */

    document.querySelectorAll(".frost-card").forEach(card => {
      card.addEventListener("mousemove", e => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left - rect.width / 2;
        const y = e.clientY - rect.top - rect.height / 2;

        card.style.transform =
          `rotateX(${(-y / 20)}deg) rotateY(${(x / 20)}deg) scale(1.03)`;
      });

      card.addEventListener("mouseleave", () => {
        card.style.transform = "rotateX(0deg) rotateY(0deg) scale(1)";
      });
    });
  </script>

</body>
</html>
