<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crown + Gallery Lab — Combined</title>

  <!-- HERO CROWN CSS -->
  <link rel="stylesheet" href="../hero-crown-lab/hero-crown.css">
  <link rel="stylesheet" href="../hero-crown-lab/theme-gradients.css">
  <link rel="stylesheet" href="../hero-crown-lab/theme-panel.css">

  <!-- HERO GALLERY CSS -->
  <link rel="stylesheet" href="../hero-gallery-lab/hero-gallery.css">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--active-day-gradient);
      transition: background 1.2s ease-in-out;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
      overflow: hidden;
    }

    body.dark-mode {
      background: var(--active-night-gradient);
    }

    #lab-title {
      position: fixed;
      top: 20px;
      left: 20px;
      font-size: 18px;
      opacity: 0.7;
      z-index: 999;
    }
  </style>
</head>

<body>

<div id="lab-title">CROWN + GALLERY LAB — 26/06/2026</div>

<!-- LEFT GALLERY LANE -->
<div class="hero-gallery-lane hero-gallery-left">
  <img class="hero-gallery-img" src="" alt="">
</div>

<!-- HERO CROWN -->
<div id="hero-crown-container">
  <img id="hero-crown-day" class="hero-crown" src="/assets/icons/day-crown.svg" alt="Day Crown">
  <img id="hero-crown-night" class="hero-crown" src="/assets/icons/night-crown.svg" alt="Night Crown">
</div>

<!-- THEME PANEL (FULL, UNCHANGED) -->
<div id="theme-panel" class="cc-theme-panel">

  <div id="theme-panel-header">
    <div id="theme-panel-title">Background Themes</div>
    <div id="theme-panel-timestamp"></div>
    <div id="theme-panel-close">✕</div>
  </div>

  <div class="theme-panel-body">

    <div class="theme-panel-section-label">Day Themes</div>
    <div class="theme-swatch-grid" id="day-swatch-grid">
      <div class="theme-swatch" data-role="day" data-key="sunrise"></div>
      <div class="theme-swatch" data-role="day" data-key="warm-daylight"></div>
      <div class="theme-swatch" data-role="day" data-key="soft-sky"></div>
      <div class="theme-swatch" data-role="day" data-key="sunset-glow"></div>
      <div class="theme-swatch" data-role="day" data-key="neon"></div>
      <div class="theme-swatch" data-role="day" data-key="galaxy"></div>
      <div class="theme-swatch" data-role="day" data-key="crown-gold"></div>
      <div class="theme-swatch" data-role="day" data-key="royal-blue"></div>
    </div>

    <div class="theme-panel-section-label">Night Themes</div>
    <div class="theme-swatch-grid" id="night-swatch-grid">
      <div class="theme-swatch" data-role="night" data-key="midnight-indigo"></div>
      <div class="theme-swatch" data-role="night" data-key="royal-night"></div>
      <div class="theme-swatch" data-role="night" data-key="aurora"></div>
      <div class="theme-swatch" data-role="night" data-key="deep-space"></div>
      <div class="theme-swatch" data-role="night" data-key="neon"></div>
      <div class="theme-swatch" data-role="night" data-key="galaxy"></div>
      <div class="theme-swatch" data-role="night" data-key="crown-gold"></div>
      <div class="theme-swatch" data-role="night" data-key="royal-blue"></div>
    </div>

  </div>
</div>

<!-- RIGHT GALLERY LANE -->
<div class="hero-gallery-lane hero-gallery-right">
  <img class="hero-gallery-img" src="" alt="">
</div>

<!-- GLOW OVERLAY -->
<div class="hero-gallery-glow-overlay">
  <div class="hero-gallery-glow-left"></div>
  <div class="hero-gallery-glow-right"></div>
</div>

<!-- ADMIN OVERLAY -->
<div id="gallery-admin" class="gallery-admin gallery-admin-hidden">
  <div class="gallery-admin-header">
    <span>Hero Gallery Admin</span>
    <button id="gallery-admin-close" type="button">×</button>
  </div>

  <div class="gallery-admin-body">
    <div class="gallery-admin-row">
      <button data-action="prev">Prev</button>
      <button data-action="next">Next</button>
      <button data-action="pause">Pause</button>
      <button data-action="shuffle">Shuffle: Off</button>
    </div>

    <div class="gallery-admin-row">
      <label for="gallery-speed">Speed</label>
      <input id="gallery-speed" type="range" min="3000" max="15000" step="1000" value="6000">
      <span id="gallery-speed-label">6s</span>
    </div>

    <div class="gallery-admin-row">
      <button id="gallery-refresh" type="button">Refresh Manifest</button>
    </div>

    <div id="gallery-toast" class="gallery-toast gallery-toast-hidden">
      <span id="gallery-toast-text"></span>
    </div>
  </div>
</div>

<!-- JS MODULES -->
<script src="../hero-crown-lab/theme-engine.js"></script>
<script src="../hero-crown-lab/hero-crown.js"></script>
<script src="../hero-crown-lab/theme-panel.js"></script>

<script src="../hero-gallery-lab/hero-gallery.js"></script>

</body>
</html>
