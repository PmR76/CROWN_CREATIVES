<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Crown Creatives – Core Preview</title>

  <!-- Fonts (shared) -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">

  <!-- Global/core CSS (optional) -->
  <link rel="stylesheet" href="./core.css">

  <!-- Injected footer component CSS -->
  <link rel="stylesheet" href="../footer-lab/footer.css">

  <!-- Injected ticker CSS (later, when ready) -->
  <!-- <link rel="stylesheet" href="../ticker-lab/ticker.css"> -->
</head>

<body>

  <!-- HEADER / HERO / MAIN (simplified scaffold) -->
  <header>
    <!-- your real header / nav / logo -->
  </header>

  <main>
    <!-- your hero, cards, content, etc. -->
    <section style="min-height: 800px; padding: 60px;">
      <h1>Crown Creatives – Core Preview</h1>
      <p>This is the integrated layout where header, content, ticker, and footer live together.</p>
    </section>
  </main>

  <!-- INJECTED FOOTER COMPONENT (from footer-index.html) -->
  <footer id="cc-footer" class="cc-footer">
    <div class="footer-glass">

      <div class="footer-icons" id="footer-icons">
        <img src="../footer-lab/icons/facebook.svg" class="footer-icon" data-id="facebook">
        <img src="../footer-lab/icons/instagram.svg" class="footer-icon" data-id="instagram">
        <img src="../footer-lab/icons/email.svg" class="footer-icon" data-id="email">
        <img src="../footer-lab/icons/copilot.svg" class="footer-icon" data-id="copilot">
      </div>

      <button id="back-to-top" class="back-to-top">▲</button>

      <div class="footer-copy">
        © 2026 Crown Creatives — All Rights Reserved<br>
        Royalty‑Free Music Provided by Pixabay
      </div>

    </div>
  </footer>

  <!-- (Later) Ticker injected just above footer -->
  <!-- <div id="cc-ticker">...</div> -->

  <!-- Injected footer behaviour -->
  <script src="../footer-lab/footer.js"></script>

  <!-- Core JS (optional) -->
  <script src="./core.js"></script>

</body>
</html>
