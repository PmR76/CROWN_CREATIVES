<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Crown Creatives – Core Preview</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">

  <!-- Core CSS -->
  <link rel="stylesheet" href="./core.css">

  <!-- Injected ticker CSS -->
  <link rel="stylesheet" href="../ticker-lab/ticker.css">

  <!-- Injected footer CSS -->
  <link rel="stylesheet" href="../footer-lab/footer.css">
</head>

<body>

  <header></header>

  <main>
    <section style="min-height: 800px; padding: 60px;">
      <h1>Crown Creatives – Core Preview</h1>
      <p>This is the integrated layout where header, content, ticker, and footer live together.</p>
    </section>
  </main>

  <!-- TICKER -->
  <div id="cc-ticker" class="cc-ticker">
    <div class="ticker-track">
      <span>CREATIVITY • ARTISTRY • RESILIENCE • IMAGINATION •</span>
    </div>
  </div>

  <!-- FOOTER -->
  <footer id="cc-footer" class="cc-footer">
    <div class="footer-glass">

      <div class="footer-icons" id="footer-icons">
        <img src="../footer-lab/icons/facebook.svg" class="footer-icon" data-id="facebook">
        <img src="../footer-lab/icons/instagram.svg" class="footer-icon" data-id="instagram">
        <img src="../footer-lab/icons/email.svg" class="footer-icon" data-id="email">
        <img src="../footer-lab/icons/copilot.svg" class="footer-icon" data-id="copilot">
      </div>

      <button id="back-to-top" class="back-to-top">▲</button>

      <div class="footer-copy">
        © 2026 Crown Creatives — All Rights Reserved<br>
        Royalty‑Free Music Provided by Pixabay
      </div>

    </div>
  </footer>
<script>
(function() {
  console.group("Ticker Integrity Check");

  const track = document.querySelector(".ticker-track");
  const container = document.getElementById("ticker-container");
  const text = document.getElementById("ticker-text");

  console.log("track (.ticker-track):", track);
  console.log("container (#ticker-container):", container);
  console.log("text (#ticker-text):", text);

  const scripts = [...document.querySelectorAll("script")].map(s => s.src);
  console.log("Loaded JS:", scripts);

  const correctPath = "../ticker-lab/ticker.js";
  const isCorrect = scripts.some(src => src.includes("ticker-lab/ticker.js"));

  console.log("Correct ticker.js loaded:", isCorrect);

  if (!isCorrect) {
    console.warn("⚠ WRONG ticker.js is being loaded — admin engine will crash.");
  }

  if (!track) {
    console.warn("⚠ .ticker-track missing — ticker cannot render.");
  }

  if (container || text) {
    console.warn("⚠ Admin ticker HTML detected in core-lab — should NOT exist.");
  }

  console.groupEnd();
})();
</script>

  <!-- Injected ticker JS -->
  <script src="../ticker-lab/ticker.js"></script>

  <!-- Injected footer JS -->
  <script src="../footer-lab/footer.js"></script>

  <!-- Core JS -->
  <script src="./core.js"></script>

</body>
</html>
