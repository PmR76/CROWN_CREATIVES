<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="cc-lab" content="core-lab">
  <title>Crown Creatives – Core Lab</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #05070b;
      color: #fff;
      font-family: system-ui, sans-serif;
    }

    iframe {
      width: 100%;
      height: 1000px;
      border: 1px solid #444;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0,0,0,0.7);
    }

    /* Lab Panel */
    #lab-panel {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 260px;
      background: rgba(10,10,20,0.92);
      backdrop-filter: blur(14px);
      border-radius: 14px;
      padding: 12px 14px;
      color: #fff;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      z-index: 999999;
      box-shadow: 0 0 26px rgba(0,0,0,0.6);
    }

    #lab-panel div {
      margin-bottom: 6px;
    }
  </style>
</head>

<body data-lab-name="core-lab">

  <!-- LAB PANEL -->
  <div id="lab-panel">
    <div id="lab-health">LAB HEALTH: Checking…</div>
    <div id="lab-html">HTML: Checking…</div>
    <div id="lab-css">CSS: Checking…</div>
    <div id="lab-js">JS: Checking…</div>
    <div id="lab-ticker">Ticker: Checking…</div>
    <div id="lab-footer">Footer: Checking…</div>
  </div>

  <!-- CORE INDEX -->
  <iframe id="coreFrame" src="./core-index.html"></iframe>

  <!-- LAB HARNESS -->
  <script src="./lab-harness.js"></script>

  <!-- LAB PANEL LOGIC -->
  <script>
  document.addEventListener("DOMContentLoaded", () => {

    const health   = document.getElementById("lab-health");
    const htmlEl   = document.getElementById("lab-html");
    const cssEl    = document.getElementById("lab-css");
    const jsEl     = document.getElementById("lab-js");
    const tickerEl = document.getElementById("lab-ticker");
    const footerEl = document.getElementById("lab-footer");

    const iframe = document.getElementById("coreFrame");

    iframe.addEventListener("load", () => {
      const doc = iframe.contentDocument;

      /* ------------------------------------------------------------
         HTML checks
      ------------------------------------------------------------ */
      const hasTickerHtml = !!doc.querySelector(".ticker-track");
      const hasFooterHtml = !!doc.getElementById("cc-footer");

      /* ------------------------------------------------------------
         CSS checks
      ------------------------------------------------------------ */
      const styles = [...doc.querySelectorAll("link[rel='stylesheet']")].map(l => l.href);

      const coreCssOk    = styles.some(href => href.includes("core.css"));
      const tickerCssOk  = styles.some(href => href.includes("ticker-lab/ticker.css"));
      const footerCssOk  = styles.some(href => href.includes("footer-lab/footer.css"));

      /* ------------------------------------------------------------
         JS checks
      ------------------------------------------------------------ */
      const scripts = [...doc.querySelectorAll("script")].map(s => s.src);

      const coreJsOk     = scripts.some(src => src.includes("core.js"));
      const tickerJsOk   = scripts.some(src => src.includes("ticker-lab/ticker.js"));
      const footerJsOk   = scripts.some(src => src.includes("footer-lab/footer.js"));

      /* ------------------------------------------------------------
         Visibility tests
      ------------------------------------------------------------ */

      // Ticker visibility test
      let tickerVisible = false;
      const tickerTrack = doc.querySelector(".ticker-track");
      if (tickerTrack) {
        const rect = tickerTrack.getBoundingClientRect();
        tickerVisible = rect.height > 0 && rect.width > 0;
      }

      // Footer visibility test
      let footerVisible = false;
      const footer = doc.getElementById("cc-footer");
      if (footer) {
        const rect = footer.getBoundingClientRect();
        footerVisible = rect.height > 0 && rect.width > 0;
      }

      /* ------------------------------------------------------------
         Panel updates
      ------------------------------------------------------------ */
      health.textContent = `LAB HEALTH: ${
        coreCssOk && coreJsOk ? "✓ Clean" : "⚠ Issues detected"
      }`;

      htmlEl.textContent = `HTML: ticker=${hasTickerHtml ? "✓" : "✗"}, footer=${hasFooterHtml ? "✓" : "✗"}`;

      cssEl.textContent = `CSS: core=${coreCssOk ? "✓" : "✗"}, ticker=${tickerCssOk ? "✓" : "✗"}, footer=${footerCssOk ? "✓" : "✗"}`;

      jsEl.textContent = `JS: core=${coreJsOk ? "✓" : "✗"}, ticker=${tickerJsOk ? "✓" : "✗"}, footer=${footerJsOk ? "✓" : "✗"}`;

      tickerEl.textContent =
        `Ticker: HTML=${hasTickerHtml ? "✓" : "✗"}, CSS=${tickerCssOk ? "✓" : "✗"}, JS=${tickerJsOk ? "✓" : "✗"}, Visible=${tickerVisible ? "✓" : "✗"}`;

      footerEl.textContent =
        `Footer: HTML=${hasFooterHtml ? "✓" : "✗"}, CSS=${footerCssOk ? "✓" : "✗"}, JS=${footerJsOk ? "✓" : "✗"}, Visible=${footerVisible ? "✓" : "✗"}`;

    });
  });
  </script>

</body>
</html>
