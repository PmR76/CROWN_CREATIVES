<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="cc-lab" content="core-lab">
  <title>Crown Creatives – Core Lab</title>

  <!-- External CSS -->
  <link rel="stylesheet" href="./core.css">
</head>

<body data-lab-name="core-lab">

  <!-- LAB PANEL -->
  <div id="lab-panel" class="lab-panel">
    <div class="lab-header">CORE‑LAB PANEL</div>

    <div id="lab-health"></div>
    <div id="lab-html"></div>
    <div id="lab-css"></div>
    <div id="lab-js"></div>
    <div id="lab-ticker"></div>
    <div id="lab-footer"></div>

    <div class="lab-meta">
      <div id="lab-name"></div>
      <div id="lab-expected"></div>
      <div id="lab-isolation"></div>
    </div>
  </div>

  <!-- CORE INDEX -->
  <iframe id="coreFrame" src="./core-index.html"></iframe>

  <!-- LAB HARNESS -->
  <script src="./lab-harness.js"></script>

  <!-- DRAGGABLE PANEL LOGIC -->
  <script>
  (function() {
    const panel = document.getElementById("lab-panel");
    let dragging = false, offsetX = 0, offsetY = 0;

    panel.addEventListener("mousedown", (e) => {
      dragging = true;
      const rect = panel.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
    });

    document.addEventListener("mousemove", (e) => {
      if (!dragging) return;
      panel.style.left = `${e.clientX - offsetX}px`;
      panel.style.top = `${e.clientY - offsetY}px`;
      panel.style.bottom = "auto";
      panel.style.right = "auto";
    });

    document.addEventListener("mouseup", () => dragging = false);
  })();
  </script>

  <!-- LAB PANEL DIAGNOSTICS -->
  <script>
  document.addEventListener("DOMContentLoaded", () => {

    const iframe = document.getElementById("coreFrame");

    const health   = document.getElementById("lab-health");
    const htmlEl   = document.getElementById("lab-html");
    const cssEl    = document.getElementById("lab-css");
    const jsEl     = document.getElementById("lab-js");
    const tickerEl = document.getElementById("lab-ticker");
    const footerEl = document.getElementById("lab-footer");

    const nameEl   = document.getElementById("lab-name");
    const expectedEl = document.getElementById("lab-expected");
    const isolationEl = document.getElementById("lab-isolation");

    iframe.addEventListener("load", () => {
      const doc = iframe.contentDocument;

      /* META */
      nameEl.textContent = `Lab: core-lab`;
      expectedEl.textContent = `Expected HTML: ./core-index.html`;
      isolationEl.textContent = `Isolation: ✓ Clean`;

      /* HTML */
      const hasTickerHtml = !!doc.querySelector(".ticker-track");
      const hasFooterHtml = !!doc.getElementById("cc-footer");

      /* CSS */
      const styles = [...doc.querySelectorAll("link[rel='stylesheet']")].map(l => l.href);
      const coreCssOk    = styles.some(h => h.includes("core.css"));
      const tickerCssOk  = styles.some(h => h.includes("ticker-lab/ticker.css"));
      const footerCssOk  = styles.some(h => h.includes("footer-lab/footer.css"));

      /* JS */
      const scripts = [...doc.querySelectorAll("script")].map(s => s.src);
      const coreJsOk     = scripts.some(s => s.includes("core.js"));
      const tickerJsOk   = scripts.some(s => s.includes("ticker-lab/ticker.js"));
      const footerJsOk   = scripts.some(s => s.includes("footer-lab/footer.js"));

      /* Visibility tests */
      const tickerTrack = doc.querySelector(".ticker-track");
      const tickerVisible = tickerTrack
        ? tickerTrack.getBoundingClientRect().width > 0
        : false;

      const footer = doc.getElementById("cc-footer");
      const footerVisible = footer
        ? footer.getBoundingClientRect().height > 0
        : false;

      /* Panel updates */
      health.textContent = `LAB HEALTH: ${
        coreCssOk && coreJsOk ? "✓ Clean" : "⚠ Issues"
      }`;

      htmlEl.textContent = `HTML: ticker=${hasTickerHtml ? "✓" : "✗"}, footer=${hasFooterHtml ? "✓" : "✗"}`;

      cssEl.textContent = `CSS: core=${coreCssOk ? "✓" : "✗"}, ticker=${tickerCssOk ? "✓" : "✗"}, footer=${footerCssOk ? "✓" : "✗"}`;

      jsEl.textContent = `JS: core=${coreJsOk ? "✓" : "✗"}, ticker=${tickerJsOk ? "✓" : "✗"}, footer=${footerJsOk ? "✓" : "✗"}`;

      tickerEl.textContent =
        `Ticker: HTML=${hasTickerHtml ? "✓" : "✗"}, CSS=${tickerCssOk ? "✓" : "✗"}, JS=${tickerJsOk ? "✓" : "✗"}, Visible=${tickerVisible ? "✓" : "✗"}`;

      footerEl.textContent =
        `Footer: HTML=${hasFooterHtml ? "✓" : "✗"}, CSS=${footerCssOk ? "✓" : "✗"}, JS=${footerJsOk ? "✓" : "✗"}, Visible=${footerVisible ? "✓" : "✗"}`;
    });
  });
  </script>

</body>
</html>
