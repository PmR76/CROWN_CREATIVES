<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Watchkeeper Panel</title>
  <style>
    body { font-family: Arial, sans-serif; background: #111; color: #0f0; padding: 20px; }
    .controls { margin-bottom: 20px; }
    button { margin-right: 10px; padding: 8px 12px; }
    footer { margin-top: 30px; font-size: 0.9em; color: #888; }
  </style>
</head>
<body>
  <h1>Watchkeeper Preview</h1>

  <div class="controls">
    <button onclick="togglePreview()">Open/Close Preview</button>
    <a href="https://www.crowncreatives.uk" target="_blank">
      <button>Launch Live Site</button>
    </a>
  </div>

  <div id="preview" style="display:none;">
    <iframe src="http://localhost:5173" width="100%" height="600"></iframe>
  </div>

  <footer>
    Deployed: <span id="stamp"></span>
  </footer>

  <script>
    function togglePreview() {
      const p = document.getElementById("preview");
      p.style.display = (p.style.display === "none") ? "block" : "none";
    }
    document.getElementById("stamp").textContent = new Date().toLocaleString();
  </script>
</body>
</html>
