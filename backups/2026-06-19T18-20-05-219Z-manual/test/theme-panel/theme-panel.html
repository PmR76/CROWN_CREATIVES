<!-- ============================================================
     CROWN CREATIVES — THEME CONTROL PANEL (GR1 CLEAN)
     Admin-only • SHIFT+P • Draggable • Background Themes
============================================================ -->

<div id="theme-panel" class="cc-theme-panel">

  <!-- HEADER (DRAG HANDLE) -->
  <div id="theme-panel-header">
    <div id="theme-panel-title">Theme Control Panel</div>
    <div id="theme-panel-close">✕</div>
  </div>

  <div class="theme-panel-body">

    <!-- ACTIVE THEME SECTION -->
    <div class="theme-panel-section-label">Active Theme</div>

    <div class="theme-options">
      <button data-theme="light" class="theme-option-btn">Light</button>
      <button data-theme="dark" class="theme-option-btn">Dark</button>
      <button data-theme="neon" class="theme-option-btn">Neon</button>
      <button data-theme="sunset" class="theme-option-btn">Sunset</button>
    </div>

    <!-- ADMIN TOOLS -->
    <div class="theme-panel-section-label">Admin Tools</div>

    <div class="admin-tools">
      <button id="resetTogglePos" class="admin-btn">Reset Toggle Position</button>
      <button id="resetToggleSize" class="admin-btn">Reset Toggle Size</button>
    </div>

  </div>

</div>
